info:
  name: GetWorkCenterSchedule
  type: http
  seq: 1

http:
  method: GET
  url: "{{goBaseUrl}}/api/work-centers/1/schedule"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test('200 недельный шаблон', () => {
          expect(res.status).to.equal(200);
          expect(res.body.workCenterId).to.equal(1);
          expect(res.body.timezone).to.equal('Europe/Moscow');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
