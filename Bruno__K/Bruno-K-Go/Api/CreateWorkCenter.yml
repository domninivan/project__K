info:
  name: CreateWorkCenter
  type: http
  seq: 1

http:
  method: POST
  url: "{{goBaseUrl}}/api/work-centers"
  body:
    type: json
    data: |-
      {
        "code": "SMOKE-001",
        "title": "Смоук станок №1",
        "active": true,
        "operationTypes": ["CUTTING"]
      }
  auth: inherit

# Повторный прогон на той же БД вернёт 409 (code UNIQUE) — это тоже валидный ответ.
runtime:
  scripts:
    - type: tests
      code: |-
        test('create work center: 201 (или 409 на повторе)', () => {
          expect([201, 409]).to.include(res.status);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
