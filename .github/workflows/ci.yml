name: CI

on:
  push:
    branches: [main]
    paths: ["GoBackend/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["GoBackend/**", ".github/workflows/ci.yml"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: GoBackend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: GoBackend/go.mod
          cache-dependency-path: GoBackend/go.sum

      - name: gofmt
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "not formatted:"
            echo "$files"
            exit 1
          fi

      - name: go mod tidy check
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: go vet
        run: go vet ./...

      - name: test
        run: go tool gotestsum --format testname -- -race -coverprofile=coverage.out ./...

      - name: coverage summary
        run: |
          if [ -s coverage.out ]; then
            go tool cover -func=coverage.out | tail -1
          else
            echo "no coverage yet (no test files)"
          fi
