name: Mirror to GitVerse

on:
  push:
    branches: ["**"]
    tags: ["**"]
  delete:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-gitverse
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Mirror to GitVerse
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
          GITVERSE_REPO: ${{ vars.GITVERSE_REPO }}
        run: |
          set -euo pipefail

          gv_auth=$(printf 'git:%s' "$GITVERSE_TOKEN" | base64 -w0)

          git clone --bare "https://github.com/${GITHUB_REPOSITORY}.git" repo.git

          cd repo.git
          git config http.postBuffer 524288000
          git config "http.https://gitverse.ru/.extraheader" "Authorization: basic ${gv_auth}"
          git remote add gitverse "https://${GITVERSE_REPO}"

          # --force: перезапись refs, --prune: удаление веток/тегов, которых нет в источнике
          git push --force \
            --prune gitverse \
            "+refs/heads/*:refs/heads/*" \
            "+refs/tags/*:refs/tags/*"


          # Smoke-test: HEAD default-ветки должен совпасть
          default_branch=$(git symbolic-ref --short HEAD)
          gh_head=$(git rev-parse HEAD)
          gv_head=$(git ls-remote gitverse "refs/heads/${default_branch}" | awk '{print $1}')
          if [ "$gh_head" != "$gv_head" ]; then
            echo "::error::HEAD mismatch: ${gh_head} (GitHub) != ${gv_head} (GitVerse), branch=${default_branch}"
            exit 1
          fi
          echo "OK: ${default_branch} @ ${gh_head}"
