services:
  app:
    image: mcr.microsoft.com/devcontainers/base:trixie
    command: sleep infinity

    volumes:
      - .:/workspaces/project__K:cached
      - node_modules:/workspaces/project__K/node_modules
      - java_target:/workspaces/project__K/JavaBackend/production-java-backend/target

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/postgres
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    depends_on:
      - postgres

  postgres:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres

    ports:
      - "5433:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/02-seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

volumes:
  postgres-data:
  node_modules:
  java_target: