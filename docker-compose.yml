services:
  app:
    image: mcr.microsoft.com/devcontainers/base:trixie
    user: vscode
    command: sleep infinity

    volumes:
      - .:/workspaces/project__K:cached

      # Frontend dependencies
      - node_modules:/workspaces/project__K/Frontend/node_modules

      # Go caches
      - go-modules:/go/pkg/mod
      - go-build-cache:/home/vscode/.cache/go-build

      # Maven cache
      - maven-repository:/home/vscode/.m2/repository

      # Maven build output Java
      - java_target:/workspaces/project__K/JavaBackend/production-java-backend/target

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/postgres
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    depends_on:
      - postgres

  postgres:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres

    ports:
      - "5433:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

      - ./database/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/02-seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

volumes:
  postgres-data:
  node_modules:
  go-modules:
  go-build-cache:
  maven-repository:
  java_target: