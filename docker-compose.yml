services:
  app:
    image: mcr.microsoft.com/devcontainers/base:trixie
    user: vscode
    volumes:
      - .:/workspaces/project__K:cached
      - node_modules:/workspaces/project__K/Frontend/node_modules
      - go-modules:/go/pkg/mod
      - go-build-cache:/home/vscode/.cache/go-build
      - maven-repository:/home/vscode/.m2/repository
    command: sleep infinity
    depends_on:
      - postgres

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
  node_modules:
  go-modules:
  go-build-cache:
  maven-repository: